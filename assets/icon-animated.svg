<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="o-lane">
<title>o-lane</title>
<style>.olaneC-run{transform-box:fill-box;transform-origin:50% 50%}.olaneC-done{transform-box:fill-box;transform-origin:50% 50%}@media (prefers-reduced-motion: no-preference){.olaneC-run{animation:olaneC-run 3.2s cubic-bezier(.45,0,.25,1) infinite}.olaneC-done{animation:olaneC-done 3.2s cubic-bezier(.45,0,.25,1) infinite}@keyframes olaneC-run{0%{transform:none}14%{transform:translate(-8px,0px)}30%{transform:translate(8px,0px) scale(0.8,0.8)}38%,100%{transform:none}}@keyframes olaneC-done{0%,30%{transform:none}38%{transform:scale(1.15,1.15)}46%,100%{transform:none}}}</style>
<rect width="128" height="128" rx="28" fill="#231d08"></rect>
<g transform="translate(20 20)"><rect x="2" y="34" width="84" height="20" rx="10" fill="#5c5136"></rect><circle cx="16" cy="44" r="5" fill="#9a8650"></circle><g class="olaneC-run"><circle cx="44" cy="44" r="7" fill="#f8dc85"></circle></g><g class="olaneC-done"><circle cx="72" cy="44" r="13" fill="#f2c230"></circle><path d="M66 44l4 4 8-9" fill="none" stroke="#231d08" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></g></g>
</svg>
